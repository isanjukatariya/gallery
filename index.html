  <meta charset="UTF-8" />

  <!-- Fontshare Editorial Typography: Switzer (Neo-Grotesque) & Sentient (Editorial Serif) -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&f[]=sentient@400,400i&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Switzer', sans-serif;
      cursor: grab;
    }

    body:active {
      cursor: grabbing;
    }

    /* Minimal Top Navigation Bar — Bulbs by Simon Dupety Inspired */
    .top-bar {
      position: fixed;
      font-family: 'Sentient', serif;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 28px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      column-gap: 72px;
      align-items: start;
      font-family: 'Switzer', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      letter-spacing: 0.04em;
      font-weight: 500;
      text-transform: uppercase;
      z-index: 40;
      pointer-events: none;
    }

    .top-bar-col {
      pointer-events: auto;
    }

    .nav-link {
      cursor: pointer;
      display: inline-block;
      color: #000000;
      text-decoration: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-link:hover {
      opacity: 0.42;
    }

    .nav-link.is-active-filter {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Raw unbordered S-Tier hover list directly beneath GOATED / S-TIER */
    .goated-raw-list {
      margin-top: 10px;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .goated-trigger-wrap:hover .goated-raw-list {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .goated-item-link {
      display: block;
      padding: 2px 0;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }

    .goated-item-link:hover {
      opacity: 0.42;
    }

    /* Center-Left Minimal Series Title Display (Sentient Editorial Serif) */
    .editorial-spec {
      position: fixed;
      top: 30vh;
      left: 38vw;
      z-index: 15;
      font-family: 'Sentient', serif;
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0.02em;
      color: #000000;
      text-transform: uppercase;
      pointer-events: none;
    }

    #specTitle {
      display: inline-block;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Pure Frames Stream Container */
    .stream-stage {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 64vh;
      perspective: 1700px;
      perspective-origin: 50% 50%;
      z-index: 20;
    }

    .frame-item {
      position: absolute;
      top: 45%;
      left: 0;
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    /* Organic Curved / Warped Frame Wrapper */
    .frame-mask {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F6F6F4;
      will-change: clip-path, transform;
    }

    .frame-img {
      width: 118%;
      height: 118%;
      max-width: none;
      object-fit: cover;
      position: absolute;
      top: -9%;
      left: -9%;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      filter: contrast(1.02);
    }

    /* Pure Series Name Beneath Frame */
    .frame-meta {
      margin-top: 9px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'Switzer', sans-serif;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: 0.045em;
      text-transform: uppercase;
      font-weight: 500;
      color: #000000;
      opacity: 0.78;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .frame-item:hover .frame-meta {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .top-bar {
        grid-template-columns: 1fr auto;
        column-gap: 24px;
        row-gap: 10px;
        padding: 16px 18px;
      }
      .editorial-spec {
        left: 18px;
        top: 25vh;
        font-size: 13px;
      }
    }
  </style>

    /* =====================================================================
       2. STREAM STATE & DOUBLE EXPONENTIAL SMOOTHING PHYSICS
       ===================================================================== */
    const stage = document.getElementById('streamStage');
    const specTitleEl = document.getElementById('specTitle');
    const FRAME_GAP = 96;

    let filterGoatedOnly = false;
    let activeList = [];
    let domItems = [];
    let totalTrackWidth = 0;

    // Ultra-fluid delta-time speed & position state
    const BASE_CRUISE_SPEED = 2.5;
    const HOVER_CRAWL_SPEED = BASE_CRUISE_SPEED * 0.08;

    let targetSpeed = BASE_CRUISE_SPEED;
    let currentSpeed = BASE_CRUISE_SPEED;

    let targetX = 0;
    let currentX = 0;
    let smoothedVelocity = 0;

    let isHovered = false;
    let hoveredSeriesTitle = null;
    let displayedSeriesTitle = '';

    // Horizontal drag state (no click-to-download or upload)
    let isDragging = false;
    let startPointerX = 0;
    let startTargetX = 0;

    let lastFrameTime = performance.now();

    function buildStream() {
      stage.innerHTML = '';
      domItems = [];

      const baseItems = filterGoatedOnly
        ? FRAMES_DATA.filter(item => item.goated)
        : FRAMES_DATA;

      // Duplicate track items if needed so wide viewports wrap seamlessly
      activeList = [...baseItems];
      while (activeList.length < 10) {
        activeList = [...activeList, ...baseItems];
      }

      let xCursor = 0;
      activeList.forEach((data) => {
        const el = document.createElement('div');
        el.className = 'frame-item';
        el.style.width = `${data.width}px`;
        el.style.height = `${data.height}px`;

        el.innerHTML = `
          <div class="frame-mask">
            <img
              class="frame-img"
              src="${data.image}"
              alt="${data.title}"
              draggable="false"
              oncontextmenu="return false;"
            />
          </div>
          <div class="frame-meta">
            <span>${data.title}</span>
          </div>
        `;

        const maskEl = el.querySelector('.frame-mask');
        const imgEl = el.querySelector('.frame-img');

        // Hover gently decelerates the stream and sets the series name
        el.addEventListener('mouseenter', () => {
          isHovered = true;
          hoveredSeriesTitle = data.title;
          setDisplayedTitle(data.title);
        });

        el.addEventListener('mouseleave', () => {
          isHovered = false;
          hoveredSeriesTitle = null;
        });

        stage.appendChild(el);

        domItems.push({
          el,
          maskEl,
          imgEl,
          data,
          baseX: xCursor,
          width: data.width,
          height: data.height,
          yOffset: data.yOffset || 0
        });

        xCursor += data.width + FRAME_GAP;
      });

      totalTrackWidth = xCursor;
      renderGoatedHeaderList();
    }

    function setDisplayedTitle(title) {
      if (!title || title === displayedSeriesTitle) return;
      displayedSeriesTitle = title;
      specTitleEl.textContent = title;
    }

    function renderGoatedHeaderList() {
      const listEl = document.getElementById('goatedRawList');
      const goatedItems = FRAMES_DATA.filter(d => d.goated);
      listEl.innerHTML = goatedItems
        .map(d => `<div class="goated-item-link" onclick="jumpToSeries('${d.title.replace(/'/g, "\\'")}')">${d.title}</div>`)
        .join('');
    }

    function toggleGoatedFilter() {
      filterGoatedOnly = !filterGoatedOnly;
      const navGoated = document.getElementById('navGoated');
      if (filterGoatedOnly) {
        navGoated.classList.add('is-active-filter');
      } else {
        navGoated.classList.remove('is-active-filter');
      }
      buildStream();
    }

    function jumpToSeries(title) {
      const found = domItems.find(item => item.data.title === title);
      if (!found) return;
      const screenCenter = window.innerWidth * 0.5;
      targetX = found.baseX - screenCenter + found.width * 0.5;
      setDisplayedTitle(found.data.title);
    }

    /* =====================================================================
       3. DELTA-TIME DOUBLE EXPONENTIAL SMOOTHING ANIMATION LOOP
       ===================================================================== */
    function animate(now) {
      const rawDt = now - lastFrameTime;
      lastFrameTime = now;
      // Normalized delta time (1.0 at 60fps, clamped to prevent tab-switch jumps)
      const dt = Math.min(2.5, Math.max(0.1, rawDt / 16.6667));

      // 1st Exponential Smoothing: Interpolate currentSpeed toward targetSpeed
      targetSpeed = isHovered ? HOVER_CRAWL_SPEED : BASE_CRUISE_SPEED;
      const speedAlpha = 1 - Math.pow(1 - 0.035, dt);
      currentSpeed += (targetSpeed - currentSpeed) * speedAlpha;

      if (!isDragging) {
        targetX += currentSpeed * dt;
      }

      // 2nd Exponential Smoothing: Interpolate currentX toward targetX
      const posAlpha = 1 - Math.pow(1 - 0.065, dt);
      const prevX = currentX;
      currentX += (targetX - currentX) * posAlpha;

      const instantVelocity = (currentX - prevX) / dt;
      smoothedVelocity += (instantVelocity - smoothedVelocity) * 0.14;

      const vw = window.innerWidth;
      const screenCenter = vw * 0.5;
      let closestToCenter = null;
      let minCenterDist = Infinity;

      if (totalTrackWidth > 0) {
        for (let i = 0; i < domItems.length; i++) {
          const item = domItems[i];

          // Seamless right-to-left modular wrap
          let rawX = item.baseX - currentX;
          let wrappedX = ((rawX % totalTrackWidth) + totalTrackWidth) % totalTrackWidth;

          // Allow full exit off the left edge before wrapping back to the right edge
          if (wrappedX > totalTrackWidth - item.width - FRAME_GAP) {
            wrappedX -= totalTrackWidth;
          }

          const frameCenter = wrappedX + item.width * 0.5;
          const distFromCenter = frameCenter - screenCenter;
          const absDist = Math.abs(distFromCenter);

          if (absDist < minCenterDist) {
            minCenterDist = absDist;
            closestToCenter = item.data;
          }

          // Normalized position across viewport (-1 left edge, 0 center, +1 right edge)
          const normX = distFromCenter / (vw * 0.56);
          const absNorm = Math.min(1.35, Math.abs(normX));

          // Screen-Edge Wrap Effect: subtle 3D cylindrical bend + fluid velocity shear
          const edgeCurve = Math.pow(Math.max(0, absNorm - 0.24), 1.85);
          const rotateY = -normX * 32 * edgeCurve;
          const translateZ = -edgeCurve * 145;
          const skewY = (normX * 2.4 * edgeCurve) + Math.max(-3.5, Math.min(3.5, smoothedVelocity * 0.1));
          const scale = 1 - edgeCurve * 0.085;

          // Organic polygon perspective warp near screen boundaries (Bulbs by Simon Dupety style)
          const pinch = Math.min(8.5, edgeCurve * 6.2 + Math.abs(smoothedVelocity) * 0.15);
          const leftPinch = normX < 0 ? pinch : pinch * 0.32;
          const rightPinch = normX > 0 ? pinch : pinch * 0.32;
          item.maskEl.style.clipPath = `polygon(${leftPinch.toFixed(2)}% 0%, ${(100 - rightPinch).toFixed(2)}% 0%, 100% 100%, 0% 100%)`;

          // Inner image counter-parallax
          const parallaxX = Math.max(-8, Math.min(8, -normX * 6.2));
          item.imgEl.style.transform = `translate3d(${parallaxX.toFixed(2)}%, 0, 0) scale(1.04)`;

          // GPU-accelerated 3D frame transform
          item.el.style.transform = `translate3d(${wrappedX.toFixed(2)}px, calc(-50% + ${item.yOffset}px), ${translateZ.toFixed(2)}px) rotateY(${rotateY.toFixed(2)}deg) skewY(${skewY.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        }
      }

      // Show hovered series name, or the centered series name when gliding freely
      if (hoveredSeriesTitle) {
        setDisplayedTitle(hoveredSeriesTitle);
      } else if (closestToCenter) {
        setDisplayedTitle(closestToCenter.title);
      }

      requestAnimationFrame(animate);
    }

    /* =====================================================================
       4. FLUID WHEEL, TRACKPAD & DRAG NAVIGATION (NO IMAGE SAVING/DOWNLOAD)
       ===================================================================== */
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      targetX += delta * 0.8;
    }, { passive: false });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.top-bar-col')) return;
      isDragging = true;
      startPointerX = e.clientX;
      startTargetX = targetX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = startPointerX - e.clientX;
      targetX = startTargetX + dx * 1.25;
    });

    const stopDragging = () => {
      isDragging = false;
    };
    window.addEventListener('pointerup', stopDragging);
    window.addEventListener('pointercancel', stopDragging);

    // Prevent default image dragstart globally
    window.addEventListener('dragstart', (e) => e.preventDefault());

    window.onload = () => {
      buildStream();
      lastFrameTime = performance.now();
      requestAnimationFrame(animate);
    };
  </script>
</body>
</html>
